<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Residence</title>
    <link rel="stylesheet" href="permission.css" />
  </head>
  <body>
    <main>
      <div class="top">
        <p class="brand">Residence</p>
        <p class="queue" id="queue" hidden></p>
      </div>
      <h1 id="title">Save this?</h1>
      <p id="when" class="when" hidden></p>
      <p id="body" class="body"></p>
      <p id="meta" class="meta"></p>

      <section class="context">
        <p class="label">From</p>
        <p id="source-preview" class="preview">—</p>
        <div id="diff" class="diff" hidden>
          <div>
            <p class="label">Saved</p>
            <p id="existing" class="preview"></p>
          </div>
          <div>
            <p class="label">Incoming</p>
            <p id="incoming" class="preview"></p>
          </div>
        </div>
        <p class="label">Why</p>
        <p id="why" class="preview">We’ll save this to your personal graph and the app you choose.</p>
      </section>

      <label class="note-label" for="personal-note">Your note <span>(optional)</span></label>
      <textarea
        id="personal-note"
        class="personal-note"
        rows="2"
        placeholder="Add a personal line before it saves…"
      ></textarea>

      <button type="button" id="change-dest" class="change-dest">Change where it goes</button>
      <div id="options" class="options" role="radiogroup" aria-label="Destination" hidden></div>

      <div class="actions" id="main-actions">
        <button type="button" id="decline" class="btn-decline">Not now</button>
        <button type="button" id="accept" class="btn-accept">Save</button>
      </div>
      <p id="err" class="err" hidden></p>
    </main>
    <script src="permission.js"></script>
  </body>
</html>
